[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "malha"
version = "0.1.0"
description = "Estudo de malha logística SP — hubs PagResolve × Ógea"
requires-python = ">=3.12"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: usa os dados reais processados em data/processed"]
